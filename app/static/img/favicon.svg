<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sombra exterior sutil -->
  <rect x="7" y="9" width="50" height="48" rx="6" fill="#000000" opacity="0.12"/>
  
  <!-- Cuerpo de la etiqueta adhesiva -->
  <rect x="6" y="8" width="50" height="48" rx="6" fill="#ffffff" stroke="#1b285d" stroke-width="3"/>
  
  <!-- Encabezado corporativo Teccam (Navy) -->
  <path d="M 6 14 A 6 6 0 0 1 12 8 L 50 8 A 6 6 0 0 1 56 14 L 56 20 L 6 20 Z" fill="#1b285d"/>
  
  <!-- Detalle decorativo rojo Teccam -->
  <rect x="11" y="12" width="12" height="3" rx="1.5" fill="#dc2626"/>
  <circle cx="50" cy="13.5" r="2" fill="#60a5fa"/>

  <!-- Barras del Código de Barras (Code 39 simbólico) -->
  <g fill="#1b285d">
    <rect x="11" y="25" width="3.5" height="19" rx="0.5"/>
    <rect x="16.5" y="25" width="2" height="19" rx="0.5"/>
    <rect x="20.5" y="25" width="4.5" height="19" rx="0.5"/>
    <rect x="27" y="25" width="2" height="19" rx="0.5"/>
    <rect x="31" y="25" width="4" height="19" rx="0.5"/>
    <rect x="37" y="25" width="2" height="19" rx="0.5"/>
    <rect x="41" y="25" width="5" height="19" rx="0.5"/>
    <rect x="48" y="25" width="3" height="19" rx="0.5"/>
  </g>
  
  <!-- Línea de texto / metadatos de la etiqueta -->
  <rect x="11" y="47.5" width="40" height="2.5" rx="1" fill="#64748b"/>
</svg>
